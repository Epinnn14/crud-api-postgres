# `docker compose up --build` starts the whole stack: Postgres + the API.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"            # so you can also connect from your machine (psql, DBeaver, ...)
    volumes:
      - pgdata:/var/lib/postgresql/data                       # the data survives container restarts
      - ./sql:/docker-entrypoint-initdb.d:ro                  # creates the table on a brand-new volume
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20

  app:
    build: .
    environment:
      # Inside the compose network the database host is the service name "db", not localhost.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
